<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocketoolz Beast 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --rtz-font: 'Outfit', sans-serif;
            --rtz-accent-color: #00fa9a;
            --rtz-grad-blue: linear-gradient(180deg, #5ecfff 0%, #0076ff 100%);
            --rtz-grad-orange: linear-gradient(180deg, #ffbc80 0%, #ff6b35 100%);
            --rtz-grad-green: linear-gradient(135deg, #a0f44f 0%, #5ce276 100%);
            --rtz-grad-purple: linear-gradient(135deg, #d660fa 0%, #8945f2 100%);

            --bg-color: #f0f2f5;
            --rtz-heading-color: #000000;
            --rtz-body-color: #111111;
            --rtz-dim-color: #555555;
            --rtz-rim: rgba(0, 0, 0, 0.1);
            --rtz-sub-bg: rgba(255, 255, 255, 0.7);
            --rtz-heading-grad: linear-gradient(135deg, #000000 0%, #444444 100%);
            --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #2c1d57;
            --rtz-heading-color: #ffffff;
            --rtz-body-color: #e0e0e0;
            --rtz-dim-color: #b1b1b6;
            --rtz-rim: rgba(168, 85, 247, 0.3);
            --rtz-sub-bg: rgba(26, 11, 60, 0.6);
            --rtz-heading-grad: linear-gradient(180deg, #ffffff 30%, #d8b4fe 100%);
            --card-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(168, 85, 247, 0.1);
        }

        [data-theme="dark"] body {
            background: radial-gradient(circle at 50% -10%, #4c1d95 0%, #2c1d57 70%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            font-family: var(--rtz-font);
            background-color: var(--bg-color);
            color: var(--rtz-body-color);
            overflow-x: hidden;
            transition: background-color 0.3s ease;
            padding: 15px;
        }

        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                linear-gradient(var(--rtz-rim) 1px, transparent 1px),
                linear-gradient(90deg, var(--rtz-rim) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
            animation: grid-scroll 25s linear infinite;
        }

        @keyframes grid-scroll {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 30px 30px;
            }
        }

        .dashboard-wrapper {
            position: relative;
            backdrop-filter: blur(25px) saturate(210%);
            -webkit-backdrop-filter: blur(25px) saturate(210%);
            border-radius: 28px;
            border: 1px solid var(--rtz-rim);
            box-shadow: var(--card-shadow);
            padding: 24px;
            background: var(--rtz-sub-bg);
            transition: all 0.4s ease;
        }

        [data-theme="dark"] .dashboard-wrapper {
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 30px rgba(168, 85, 247, 0.05);
        }

        .dashboard-wrapper::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg,
                    transparent 45%,
                    rgba(255, 255, 255, 0.03) 48%,
                    rgba(255, 255, 255, 0.08) 50%,
                    rgba(255, 255, 255, 0.03) 52%,
                    transparent 55%);
            pointer-events: none;
            z-index: 0;
            animation: reflection-sweep 15s infinite linear;
        }

        @keyframes reflection-sweep {
            0% {
                transform: translate(-10%, -10%);
            }

            100% {
                transform: translate(10%, 10%);
            }
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .header-content {
            display: flex;
            flex-direction: column;
        }

        .rtz-header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--rtz-sub-bg);
            border: 1px solid var(--rtz-rim);
            border-radius: 100px;
            width: fit-content;
            margin-bottom: 8px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background: var(--rtz-accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--rtz-accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.5;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .badge-text {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--rtz-dim-color);
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            background: var(--rtz-heading-grad);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .theme-toggle {
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--rtz-sub-bg);
            border: 1px solid var(--rtz-rim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--rtz-heading-color);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-2px);
            background: var(--rtz-accent-color);
            color: #000;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .rtz-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 48px;
            border-radius: 14px;
            font-weight: 500;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            color: #fff !important;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-blue {
            background: var(--rtz-grad-blue);
            box-shadow: 0 8px 20px rgba(0, 118, 255, 0.2);
        }

        .btn-orange {
            background: var(--rtz-grad-orange);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.45);
        }

        [data-theme="dark"] .btn-orange {
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5), 0 0 15px rgba(255, 188, 128, 0.2);
        }

        .btn-blue:hover {
            box-shadow: 0 12px 30px rgba(0, 118, 255, 0.6), 0 0 20px rgba(0, 118, 255, 0.3);
        }

        .btn-orange:hover {
            box-shadow: 0 12px 30px rgba(255, 107, 53, 0.7), 0 0 20px rgba(255, 188, 128, 0.4);
        }

        .rtz-btn:hover {
            transform: scale(1.02) translateY(-2px);
            filter: brightness(1.1);
        }

        .support-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .support-card {
            background: var(--rtz-sub-bg);
            border: 1px solid var(--rtz-rim);
            border-radius: 18px;
            padding: 12px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s ease;
        }

        .support-card:hover {
            transform: translateY(-3px);
            border-color: var(--rtz-accent-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .support-card i {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .fa-whatsapp {
            color: #25D366;
        }

        .fa-telegram {
            color: #0088cc;
        }

        .support-card span {
            font-size: 11px;
            font-weight: 600;
            color: var(--rtz-dim-color);
        }

        .features-box {
            background: var(--rtz-sub-bg);
            border: 1px solid var(--rtz-rim);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .features-box h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--rtz-heading-color);
        }

        .features-list {
            list-style: none;
        }

        .features-list li {
            font-size: 13px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--rtz-body-color);
        }

        .features-list li i {
            color: var(--rtz-accent-color);
            font-size: 12px;
        }

        .dash-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--rtz-sub-bg);
            border: 1px solid var(--rtz-rim);
            border-radius: 16px;
            padding: 12px 15px;
        }

        .v-badge {
            background: var(--rtz-grad-blue);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 800;
        }

        .footer-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--rtz-dim-color);
        }

        .footer-link {
            color: var(--rtz-accent-color);
            text-decoration: none;
        }
    </style>
</head>

<body data-theme="dark">
    <div class="grid-bg"></div>
    <div class="dashboard-wrapper">
        <header class="dash-header">
            <div class="header-content">
                <div class="rtz-header-badge">
                    <div class="badge-dot"></div>
                    <span class="badge-text">#1 Beast in Industry</span>
                </div>
                <h1 class="header-title">Rocketoolz</h1>
            </div>
            <div id="themeToggle" class="theme-toggle">
                <i class="fas fa-moon"></i>
            </div>
        </header>

        <div class="actions-grid">
            <a href="https://dash.rocketoolz.com/" target="_blank" class="rtz-btn btn-blue">
                <i class="fas fa-lock"></i> Access Members Area
            </a>
            <button id="browserClearBtn" class="rtz-btn btn-orange">
                <i class="fas fa-broom"></i> Browser Clear

        </div>

        <div class="support-row">
            <a href="https://whatsapp.com/channel/0029VbBp9FdEFeXpK7X6xW00" target="_blank" class="support-card">
                <i class="fab fa-whatsapp"></i>
                <span>WhatsApp</span>
            </a>
            <a href="https://t.me/rocketoolz" target="_blank" class="support-card">
                <i class="fab fa-telegram"></i>
                <span>Telegram</span>
            </a>
        </div>

        <div class="features-box">
            <h3>Why Rocketoolz? 🚀</h3>
            <ul class="features-list">
                <li><i class="fas fa-star"></i> 100+ AI Tools</li>
                <li><i class="fas fa-gamepad"></i> Intuitive Dashboard</li>
                <li><i class="fas fa-rocket"></i> Early Tool Access</li>
                <li><i class="fas fa-shield-alt"></i> Secure & Reliable</li>
            </ul>
        </div>

        <footer class="dash-footer">
            <div class="footer-text">
                <span class="v-badge">v3.0</span>
                Powered by <a href="https://rocketoolz.com/" target="_blank" class="footer-link">Rocketoolz</a>
            </div>
            <div class="footer-text" style="font-size: 10px; opacity: 0.8;">
                Built to Break Limits 💥
            </div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
